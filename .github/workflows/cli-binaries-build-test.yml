name: CLI binaries

on:
  push:
    branches: [main]
    paths:
      - 'src/runner/**'
      - 'src/cli/**'
      - 'src/shared-lib/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/runner/**'
      - 'src/cli/**'
      - 'src/shared-lib/**'

jobs:
  build-rmap:
    name: Build rmap
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
        working-directory: src/cli

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27.0

      - name: Get dependencies
        run: make get-deps

      - name: Build
        run: make rmap

      - name: Test
        run: make tests

  build-reconmapd:
    name: Build reconmapd
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src/runner

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27.0

      - name: Get dependencies
        run: make get-deps

      - name: Build
        run: make reconmapd

      - name: Test
        run: make tests

  build-shared-lib:
    name: Build shared-lib
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src/shared-lib

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27.0

      - name: Get dependencies
        run: make get-deps

      - name: Test
        run: make tests
