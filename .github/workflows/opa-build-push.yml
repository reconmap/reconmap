name: OPA

on:
  push:
    branches:
      - main
    paths:
      - 'policy/**'
      - '.github/workflows/opa-build-push.yml'

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push OPA image
        run: docker compose build opa && docker compose push opa
