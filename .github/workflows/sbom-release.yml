name: SBOM Generation and Release

on:
  push:
    tags:
      - '*'

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.42.2

      - name: Generate SBOM for Dashboard
        run: syft dir:src/dashboard --source-name reconmap-dashboard --source-version ${{ github.ref_name }} -o spdx-json > dashboard-sbom.spdx.json

      - name: Generate SBOM for API
        run: syft dir:src/server --source-name reconmap-api --source-version ${{ github.ref_name }} -o spdx-json > api-sbom.spdx.json

      - name: Generate SBOM for Runner
        run: syft dir:src/runner --source-name reconmap-runner --source-version ${{ github.ref_name }} -o spdx-json > runner-sbom.spdx.json

      - name: Generate SBOM for CLI
        run: syft dir:src/cli --source-name reconmap-cli --source-version ${{ github.ref_name }} -o spdx-json > cli-sbom.spdx.json

      - name: Create Release and Upload SBOMs
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dashboard-sbom.spdx.json
            api-sbom.spdx.json
            runner-sbom.spdx.json
            cli-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
