type: object
properties:
  id:
    type: integer
    nullable: true
  subject_id:
    type: string
  role:
    type: string
    nullable: true
    enum:
    - administrator
    - superuser
    - user
    - client
  short_bio:
    type: string
    nullable: true
  preferences:
    nullable: true
  # Identity fields below are owned by Keycloak and returned merged by the API.
  username:
    type: string
  email:
    type: string
  first_name:
    type: string
  last_name:
    type: string
  full_name:
    type: string
    nullable: true
    default: ''
  active:
    type: boolean
    default: true
  created_at:
    type: string
    nullable: true
  updated_at:
    type: string
    nullable: true
  last_login_at:
    type: string
    nullable: true
  locale:
    type: string
    nullable: true
  timezone:
    type: string
  mfa_enabled:
    type: boolean
    default: false
required:
- subject_id
- username
- email
- first_name
- last_name
- timezone
