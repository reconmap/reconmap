name: reconmap

volumes:
  redis_data:
  postgres_varlib:
  dataprotection-keys:
  rustfs_data:
  rustfs_logs:

services:
  redis:
    image: redis:8.8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 20 1 --loglevel warning
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.3-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    volumes:
      - postgres_varlib:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    environment:
      # PostgreSQL 18 images default PGDATA to /var/lib/postgresql/18/docker; keep it on the mounted volume.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_RECONMAP_USER: ${POSTGRES_RECONMAP_USER}
      POSTGRES_RECONMAP_PASSWORD: ${POSTGRES_RECONMAP_PASSWORD}
      POSTGRES_KEYCLOAK_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_KEYCLOAK_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: "start --import-realm"
    # See https://www.keycloak.org/server/all-config
    environment:
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      VAR_DASHBOARD_URL: "http://localhost:5500"
      VAR_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
      VAR_API_CLIENT_SECRET: "${KEYCLOAK_API_CLIENT_SECRET}"
    volumes:
      - ./infra/keycloak/reconmap-theme-keycloak.jar:/opt/keycloak/providers/reconmap-theme-keycloak.jar:ro
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/reconmap-realm.json:ro
      - ./infra/keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/opt/keycloak/healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    profiles: [ "app" ]
    image: ghcr.io/reconmap/dashboard:latest
    restart: unless-stopped
    volumes:
      - ./config-ui.json:/usr/share/nginx/html/config.json:ro
    ports:
      - "5500:5500"
    depends_on:
      keycloak:
        condition: service_healthy

  ngapi:
    profiles: [ "app" ]
    image: ghcr.io/reconmap/ng-api:latest
    build:
      context: ./src/server/Api
      dockerfile: docker/Dockerfile
    volumes:
      - "./config-ngapi.json:/app/appsettings.json"
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    ports:
      - "5510:5510"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5510
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=reconmap;Username=${POSTGRES_RECONMAP_USER};Password=${POSTGRES_RECONMAP_PASSWORD}
      - Redis__Password=${REDIS_PASSWORD}
      - Keycloak__ClientSecret=${KEYCLOAK_API_CLIENT_SECRET}
      - Storage__S3__SecretKey=${RUSTFS_SECRET_KEY}
      - Opa__ServerUrl=${OPA_SERVER_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  mcp:
    profiles: [ "app" ]
    image: ghcr.io/reconmap/mcp:latest
    build:
      context: ./src/server
      dockerfile: Mcp/docker/Dockerfile
    volumes:
      - "./config-ngapi.json:/app/appsettings.json:ro"
    ports:
      - "5520:5520"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5520
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=reconmap;Username=${POSTGRES_RECONMAP_USER};Password=${POSTGRES_RECONMAP_PASSWORD}
      - Redis__Password=${REDIS_PASSWORD}
      - Keycloak__ClientSecret=${KEYCLOAK_API_CLIENT_SECRET}
      - Opa__ServerUrl=${OPA_SERVER_URL}
      # The bundled Keycloak is served over plain HTTP; remove when it sits behind HTTPS.
      - Keycloak__RequireHttpsMetadata=false
      - Mcp__PublicUrl=${MCP_PUBLIC_URL:-http://localhost:5520/mcp}
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    profiles: [ 'runner' ]
    image: ghcr.io/reconmap/runner:latest
    restart: unless-stopped
    ports:
      - "5520:5520"
    volumes:
      - "./config-runner.json:/root/.config/reconmap/config-reconmapd.json"
    command: /app/reconmapd run
    environment:
      RMAP_KEYCLOAK_DEBUG: "false"
      RMAP_KEYCLOAK_SKIP_TLS_VERIFY: "true"
      RMAP_REDIS_PASSWORD: "${REDIS_PASSWORD}"

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  opa:
    image: openpolicyagent/opa:1.21.2
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ./policy:/policy
    command: [ "run", "--server", "--addr", ":8181", "--log-format=json", "/policy" ]
