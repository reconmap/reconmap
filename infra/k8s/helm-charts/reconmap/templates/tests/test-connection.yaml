apiVersion: v1
kind: Pod
metadata:
  name: {{ include "reconmap.fullname" . }}-test
  labels:
    {{- include "reconmap.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command:
        - sh
        - -c
        - |
          wget -qO- http://{{ include "reconmap.componentName" (dict "root" . "component" "api") }}:5510/health &&
          wget -qO- http://{{ include "reconmap.componentName" (dict "root" . "component" "dashboard") }}:5500/ >/dev/null &&
          wget -qO- http://{{ include "reconmap.componentName" (dict "root" . "component" "keycloak") }}:8080/realms/reconmap >/dev/null
