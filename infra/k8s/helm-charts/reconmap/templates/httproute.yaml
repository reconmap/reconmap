{{- if .Values.gateway.enabled }}
{{- range $component, $port := dict "dashboard" 5500 "api" 5510 "keycloak" 8080 }}
{{- $c := dict "root" $ "component" $component }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "reconmap.componentName" $c }}
  labels:
    {{- include "reconmap.labels" $c | nindent 4 }}
spec:
  parentRefs:
    {{- required "gateway.parentRefs is required when gateway.enabled=true" $.Values.gateway.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ index $.Values.hosts $component | quote }}
  rules:
    - backendRefs:
        - name: {{ include "reconmap.componentName" $c }}
          port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
