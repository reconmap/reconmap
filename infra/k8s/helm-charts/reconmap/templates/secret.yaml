{{- if not .Values.secrets.existingSecret }}
{{- $existing := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace (include "reconmap.secretName" .)) }}{{ $existing = .data | default dict }}{{ end }}
{{- $keys := dict
  "postgres-password" .Values.secrets.postgresPassword
  "db-password" .Values.secrets.dbPassword
  "keycloak-db-password" .Values.secrets.keycloakDbPassword
  "redis-password" .Values.secrets.redisPassword
  "rabbitmq-password" .Values.secrets.rabbitmqPassword
  "keycloak-admin-password" .Values.secrets.keycloakAdminPassword
  "admin-client-secret" .Values.secrets.adminClientSecret
  "api-client-secret" .Values.secrets.apiClientSecret
  "s3-secret-key" .Values.secrets.s3SecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconmap.secretName" . }}
  labels:
    {{- include "reconmap.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $given := $keys }}
  {{- if $given }}
  {{ $key }}: {{ $given | b64enc }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
