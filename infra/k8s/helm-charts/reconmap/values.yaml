nameOverride: ""
fullnameOverride: ""

# Public endpoints. Every URL handed to the dashboard, API and Keycloak is derived from these.
# Expose them with the Gateway API HTTPRoutes below, or by your own means.
hosts:
  dashboard: reconmap.local
  api: api.reconmap.local
  keycloak: auth.reconmap.local
tls: false

gateway:
  enabled: false
  # parentRefs of an existing Gateway, e.g.
  # - name: shared-gateway
  #   namespace: gateway-system
  parentRefs: []

# Credentials live in a single Secret. Unset values are generated on first install and kept on upgrade.
# To bring your own (External Secrets, Sealed Secrets, ...) set existingSecret and provide these keys:
#   postgres-password, db-password, keycloak-db-password, redis-password, rabbitmq-password,
#   keycloak-admin-password, admin-client-secret, api-client-secret, s3-secret-key
secrets:
  existingSecret: ""
  postgresPassword: ""
  dbPassword: ""
  keycloakDbPassword: ""
  redisPassword: ""
  rabbitmqPassword: ""
  keycloakAdminPassword: ""
  adminClientSecret: ""
  apiClientSecret: ""
  s3SecretKey: ""

networkPolicy:
  enabled: true

# Shared defaults for the pods of every component; override per component with `resources`, etc.
imagePullSecrets: []

postgres:
  enabled: true
  externalHost: ""          # used when enabled=false
  image:
    repository: ghcr.io/reconmap/postgres
    tag: ""                 # defaults to .Chart.AppVersion
    digest: ""
    pullPolicy: IfNotPresent
  database: reconmap
  user: reconmapper
  keycloakUser: keycloaker
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

redis:
  enabled: true
  externalHost: ""
  image:
    repository: redis
    tag: 8.8-alpine
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

rabbitmq:
  enabled: true
  externalHost: ""
  user: reconmap
  image:
    repository: rabbitmq
    tag: 4.3-alpine
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# S3-compatible attachment storage. Disable and set `endpoint` to use an external service.
s3:
  enabled: true
  endpoint: ""              # defaults to the bundled RustFS service
  useHttp: true
  accessKey: reconmap
  bucket: attachments
  image:
    repository: rustfs/rustfs
    tag: 1.0.1
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

opa:
  enabled: true
  image:
    repository: ghcr.io/reconmap/opa
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

keycloak:
  enabled: true
  image:
    repository: ghcr.io/reconmap/keycloak
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  bootstrapAdminUser: admin
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1Gi}

api:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/reconmap/api
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  persistence:               # ASP.NET Data Protection keys
    size: 100Mi
    storageClassName: ""
  # Extra settings in ASP.NET env-var form (double underscore for nesting). The image already
  # bakes in sensible defaults, so only set what differs.
  extraEnv: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

dashboard:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/reconmap/dashboard
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Extra keys merged into the generated config.json (see src/dashboard/config-schema.json).
  extraConfig: {}
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 64Mi}
